services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - URL_SCHEME=${URL_SCHEME}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - API_SUB_DOMAIN=${API_SUB_DOMAIN}
      - CONSOLE_SUB_DOMAIN=${CONSOLE_SUB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fluxend_network
    depends_on:
      - fluxend_api
      - fluxend_frontend

  fluxend_db:
    image: postgres:17
    container_name: fluxend_db
    restart: always
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - fluxend_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fluxend_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DATABASE_USER:-postgres}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  fluxend_api:
    image: fluxend/api:latest
    platform: linux/amd64
    container_name: fluxend_api
    restart: always
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_HOST=fluxend_db
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL_MODE=disable
    depends_on:
      fluxend_db:
        condition: service_healthy
    networks:
      - fluxend_network
    volumes:
      - ./.env:/app/.env:ro # Always read from host

  fluxend_frontend:
    image: fluxend/frontend:latest
    platform: linux/amd64
    container_name: fluxend_frontend
    restart: always
    environment:
      - VITE_FLX_INTERNAL_URL=${INTERNAL_URL}
    depends_on:
      - fluxend_api
    networks:
      - fluxend_network

networks:
  fluxend_network:
    name: fluxend_network
    driver: bridge

volumes:
  fluxend_db_data:
  caddy_data:
  caddy_config:
